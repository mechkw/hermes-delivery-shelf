name: Feature request
description: Suggest a useful improvement
title: "[Idea] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Start with the problem, not just a proposed button.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would help?
      description: Describe the smallest change that would make this work for you.
    validations:
      required: true
