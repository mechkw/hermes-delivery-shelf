name: Bug report
description: Report a reproducible problem in Delivery Shelf
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Use fictional examples. For security issues, follow SECURITY.md instead."
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Plugin release or commit and Hermes version
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where did it happen?
      options:
        - Dashboard
        - Desktop
        - Tool or command
        - Installation
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include what you expected and what actually happened.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and useful details
      description: OS, browser, screen width, and sanitized error messages. No secrets or private conversations.
